<!doctype html>
<!-- Source of public/og.png (1200x630, the link-preview card). Render it with: node scripts/social-card.js
     Self-contained: inline styles, Inter from the vendored font. The three facts are checked against the
     recordings by scripts/unit.js (numbers come from scripts/totals.js), so update them together. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kindred social card</title>
<style>
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 800; src: url('../public/vendor/inter/inter-latin.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #07080c; }
  body { position: relative; font-family: Inter, system-ui, 'Segoe UI', sans-serif; color: #f1f5f9; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; inset: 0; background: radial-gradient(55% 75% at 100% 0%, rgba(217, 70, 239, .20), transparent 62%), radial-gradient(45% 70% at 0% 100%, rgba(251, 191, 36, .10), transparent 62%); }
  .wrap { position: relative; display: flex; flex-direction: column; height: 100%; padding: 52px 70px 52px; }
  .top { display: flex; align-items: center; gap: 16px; }
  .mark { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #d946ef, #fbbf24); }
  .name { font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
  .url { margin-left: auto; font-size: 22px; color: #94a3b8; }
  h1 { margin-top: 34px; font-size: 68px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #e879f9, #fcd34d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 20px; font-size: 26px; font-weight: 500; color: #e2e8f0; letter-spacing: -.01em; }
  .facts { margin-top: auto; display: grid; grid-template-columns: .8fr 1.2fr 1.2fr; gap: 18px; }
  .fact { border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .045); border-radius: 18px; padding: 16px 22px 18px; }
  .v { display: flex; align-items: center; height: 50px; font-size: 46px; font-weight: 800; letter-spacing: -.03em; color: #5eead4; }
  .l { margin-top: 6px; font-size: 20px; line-height: 1.25; color: #cbd5e1; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="top"><div class="mark"></div><div class="name">Kindred</div><div class="url">kindred-taste.vercel.app</div></div>
    <h1>Find who your audience <em>already loves</em>, and where to meet them.</h1>
    <p class="sub">Agents, but with taste &middot; powered by Qloo Taste AI</p>
    <div class="facts">
      <div class="fact"><div class="v">7</div><div class="l">Qloo uses</div></div>
      <div class="fact"><div class="v"><svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 25l10 10L39 13"/></svg></div><div class="l">every partner checked against Qloo</div></div>
      <div class="fact"><div class="v">29 of 40</div><div class="l">LLM-only picks unsupported by Qloo, across 10 recorded runs</div></div>
    </div>
  </div>
</body>
</html>
